spring.application.name=balance_ledger

# Test configuration – use an in‑memory H2 database and disable Flyway migrations
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for tests (we don't need real migrations)
spring.flyway.enabled=false

# Hibernate can create the schema automatically for the test DB
spring.jpa.hibernate.ddl-auto=none
