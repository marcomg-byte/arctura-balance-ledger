spring.application.name=payment_bridge
spring.config.import=optional:file:.env[.properties]

# Database Configuration (defaults to in‑memory H2 for local runs)
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway migrations when running locally (you can enable via env overrides)
spring.flyway.enabled=false

# Hibernate – let it create the schema automatically in the dev H2 DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
